[project]
name = "cu013-agentic-ivr"
version = "0.2.0"
description = "Conversational IT-support backend for CU013 and XCALLY"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111.0,<1.0.0",
  "pydantic>=2.7.0,<3.0.0",
  "langgraph>=1.0.10,<2.0.0",
  "langgraph-checkpoint>=4.1.1,<5.0.0",
  "google-genai>=1.0.0",
  "google-cloud-firestore>=2.16.0,<3.0.0",
  "uvicorn>=0.30.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10.0.0",
  "pytest-asyncio>=1.4.0,<2.0.0",
  "httpx>=0.27.0,<1.0.0",
  "ruff>=0.6.0,<1.0.0",
  "mypy>=1.11.0,<2.0.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

# Versioned prompt templates travel inside the wheel and the image; the
# private runtime protocols never do and are mounted at runtime instead.
[tool.setuptools.package-data]
"app.conversation" = ["prompt_templates/*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.ruff.lint.per-file-ignores]
"evals/*.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
strict = true
pretty = true
