  - case_id: late-result-reconciles
    family: late-result
    description: A late result reconciles the existing operation; nothing new is created.
    initial_state: { identity_validated: true, conversation_goal: UNLOCK_ACCOUNT, goal_revision: 1, confirmation: authorized, pending_operation: unknown }
    turns:
