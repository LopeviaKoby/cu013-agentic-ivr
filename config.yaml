# NO secrets in this file.
# Local provisional secrets belong in .env (gitignored).
# Cloud runtime secrets must come from Secret Manager when they exist.

gcp:
  project_id: tivit-cu013-prd
  region: us-east1

firestore:
  database: "(default)"

artifact_registry:
  repository: cu013-containers-dev
  location: us-east1

vertex:
  # Model serving location for the active conversational baseline
  # (Gemini 3.5 Flash-Lite, reasoning level MINIMAL). This is the Vertex AI
  # serving location, not infrastructure: Cloud Run and Firestore stay in
  # us-east1 below. Do not confuse the two regions.
  location: global
  # El modelo baseline pertenece a la configuración de runtime/evaluación
  # y sigue sujeto a benchmark antes de producción.

cloud_run:
  service: cu013-runtime-dev
  region: us-east1
  cpu: 1
  memory: 512Mi
  concurrency: 1
  max_instances: 1
  min_instances: 0
  benchmark_min_instances: 1
  billing: request

security:
  api_key_secret: cu013-api-key-dev
